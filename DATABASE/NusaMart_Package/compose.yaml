name: nusamart-lab

x-postgres-common: &postgres-common
  image: postgres:17-alpine
  environment:
    POSTGRES_USER: lab
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Salin .env.example menjadi .env dan isi POSTGRES_PASSWORD}
    POSTGRES_DB: nusamart
  command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - max_replication_slots=10
    - -c
    - max_wal_senders=10
    - -c
    - max_worker_processes=16
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U lab -d nusamart"]
    interval: 5s
    timeout: 3s
    retries: 15
  networks:
    - nusamart-net
  restart: unless-stopped

services:
  pg-jakarta:
    <<: *postgres-common
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_jakarta_data:/var/lib/postgresql/data

  pg-surabaya:
    <<: *postgres-common
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pg_surabaya_data:/var/lib/postgresql/data

  pg-pontianak:
    <<: *postgres-common
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pg_pontianak_data:/var/lib/postgresql/data

networks:
  nusamart-net:
    name: nusamart-net
    driver: bridge

volumes:
  pg_jakarta_data:
  pg_surabaya_data:
  pg_pontianak_data:
