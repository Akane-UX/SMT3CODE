name: nusamart-lab

x-postgres-common: &postgres-common
  image: postgres:17-alpine
  environment:
    POSTGRES_USER: lab
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Salin .env.example menjadi .env dan isi POSTGRES_PASSWORD}
    POSTGRES_DB: nusamart
  command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - max_replication_slots=10
    - -c
    - max_wal_senders=10
    - -c
    - max_worker_processes=16
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U lab -d nusamart"]
    interval: 5s
    timeout: 3s
    retries: 15
  networks:
    - nusamart-net
  restart: unless-stopped

services:
  pg-jakarta:
    <<: *postgres-common
    container_name: nusamart-lab-pg-jakarta-1
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_jakarta_data:/var/lib/postgresql/data

  pg-surabaya:
    <<: *postgres-common
    container_name: nusamart-lab-pg-surabaya-1
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pg_surabaya_data:/var/lib/postgresql/data

  pg-pontianak:
    <<: *postgres-common
    container_name: nusamart-lab-pg-pontianak-1
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pg_pontianak_data:/var/lib/postgresql/data

  # Layanan pgAdmin opsional (hanya jalan jika dipanggil: docker compose --profile with-pgadmin up -d)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nusamart-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: lab@nusamart.com
      PGADMIN_DEFAULT_PASSWORD: DBTech3Q
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - ./servers_docker.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:5050:80"
    networks:
      - nusamart-net
    restart: unless-stopped
    profiles: ["with-pgadmin"]

networks:
  nusamart-net:
    name: nusamart-net
    driver: bridge

volumes:
  pg_jakarta_data:
  pg_surabaya_data:
  pg_pontianak_data:
